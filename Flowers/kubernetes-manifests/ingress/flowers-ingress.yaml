apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flowers-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-cors@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: arch.homework
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flowers-service
            port:
              number: 80
      - path: /bill
        pathType: Prefix
        backend:
          service:
            name: billing-service
            port:
              number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors
  namespace: default
spec:
  headers:
    customRequestHeaders:
      Access-Control-Allow-Origin: "*"
      Access-Control-Allow-Methods: "PUT, GET, POST, OPTIONS, DELETE"
      Access-Control-Allow-Headers: "DNT, Keep-Alive, User-Agent, X-Requested-With, If-Modified-Since, Cache-Control, Content-Type"